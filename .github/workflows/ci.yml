name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff
      - name: Ruff (lint + imports)
        run: ruff check netbox_biomed/ tools/

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Vérifier le contenu de la wheel (templates, locale, migration)
        run: |
          python - << 'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          checks = {
              'templates': any(n.endswith('.html') for n in names),
              'locale .mo': any(n.endswith('.mo') for n in names),
              'migration initiale': any('migrations/0001_initial.py' in n for n in names),
          }
          for label, ok in checks.items():
              print(('OK  ' if ok else 'FAIL'), label)
          sys.exit(0 if all(checks.values()) else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
